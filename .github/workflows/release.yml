name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for OIDC — this is what npm trusted publishing authenticates with.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Proof-of-presence for publishing. A push to main can reach npm without any
    # stored credential (OIDC), so "who can push to main" would otherwise mean
    # "who can publish". This environment requires a human to approve the run in
    # the Actions UI before the job starts, and is restricted to main.
    #
    # It gates the whole job, including the version step. When only a Version
    # Packages PR is being opened, approve it the same way — the job does not
    # distinguish, and approving costs one click.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7

      # Pinned to the packageManager version — see the note in ci.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # `changeset publish` shells out to npm, so node must be present alongside
      # bun. registry-url writes the registry into .npmrc; no auth token is
      # configured — npm detects the OIDC environment and uses trusted
      # publishing instead. package-manager-cache is off because a restored npm
      # cache can shadow the CLI upgrade below.
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0; "22" resolves to the
          # latest 22.x, which satisfies that floor.
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Node 22 bundles npm 10.x, below the 11.5.1 floor for trusted publishing.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # No NODE_AUTH_TOKEN and no NPM_CONFIG_PROVENANCE: authentication comes
      # from OIDC, and trusted publishing generates provenance automatically.
      # Requires a trusted publisher configured on npmjs.com for @intentface/chat
      # pointing at this repo and this workflow file (release.yml).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
