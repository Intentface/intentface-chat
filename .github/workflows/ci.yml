name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit least privilege, so a change to the repo-wide default can't widen it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the packageManager version, not "latest". bun.lock was
      # resolved by this version, and a newer bun can dedupe transitive
      # dependencies differently — which is exactly how a duplicate
      # prosemirror-model slipped past local checks and broke the Vercel build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # Generates .source (postinstall: fumadocs-mdx) so the docs build compiles.
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Package tests
        run: bun test
        working-directory: packages/chat

      - name: Package build (publint gate)
        working-directory: packages/chat
        run: |
          bun run build
          bunx publint

      # The docs demos are the styled reference people copy, so they must
      # compile against the built package with no app aliases in scope. Runs
      # after the build above, which produces the dist this typechecks against.
      - name: Demo portability gate
        run: bunx tsc -p tsconfig.demos.json

      # Docs drift silently — a renamed part or dropped prop breaks no build, so
      # pages go on documenting an API that no longer exists. This resolves the
      # real parts through the type checker and fails on any contradiction.
      - name: Docs match the package
        run: node scripts/audit-docs.mjs

      # No credentials: the chat route takes the visitor's own key from a cookie
      # at request time, so the build needs nothing in the environment.
      - name: App build
        run: bun run build
