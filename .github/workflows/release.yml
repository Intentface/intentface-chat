name: Release

on:
  push:
    branches: [main]
    # A release can only follow a changeset landing here or being consumed here.
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
  # Recovery path: with the filter above, a failed publish has no push to retry on.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Opens or updates the Version Packages PR. Publishes nothing, so it runs unattended.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      needs-publish: ${{ steps.check.outputs.needs-publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Must precede `changeset version`, which rewrites the version being compared.
      - name: Decide whether anything needs publishing
        id: check
        run: |
          name=$(node -p "require('./packages/chat/package.json').name")
          version=$(node -p "require('./packages/chat/package.json').version")
          # Exact version, not the latest dist-tag, and a registry error must not
          # read as "unpublished" — that would ask for an approval on every run.
          if output=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already published"
            echo "needs-publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" <<<"$output"; then
            echo "$name@$version is not on the registry"
            echo "needs-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed for $name@$version: $output"
            exit 1
          fi

      # Pinned to the packageManager version — see the note in ci.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: Open or update the release PR
        uses: changesets/action@v1
        with:
          version: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    if: needs.version.outputs.needs-publish == 'true'
    runs-on: ubuntu-latest
    # OIDC reaches npm with no stored credential, so this gate is what stops
    # "can push to main" from meaning "can publish".
    environment: npm-publish
    permissions:
      # changesets/action pushes git tags and creates GitHub Releases on publish.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # `changeset publish` shells out to npm. No auth token is configured: npm
      # detects OIDC and uses trusted publishing, which needs node >= 22.14.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # A restored cache can shadow the npm upgrade below.
          package-manager-cache: false

      # Node 22 bundles npm 10.x; trusted publishing needs >= 11.5.1.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Publish to npm
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
